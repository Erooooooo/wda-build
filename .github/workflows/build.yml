name: build-wda
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Clone WebDriverAgent
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git wda

      - name: Build for device
        run: |
          cd wda
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" | tail -30

      - name: Package IPA
        run: |
          ls -la wda/build || true
          mkdir -p Payload
          cp -R wda/build/WebDriverAgentRunner-Runner.app Payload/
          zip -qr WebDriverAgent.ipa Payload
          ls -lh WebDriverAgent.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: wda-ipa
          path: WebDriverAgent.ipa
          if-no-files-found: error
